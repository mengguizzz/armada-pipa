ARMADA_DEVICE_ID=xiaomi-pipa
ARMADA_DEVICE_NAME='Xiaomi Pad 6'
ARMADA_SOC_CLASS=SM8250

# The platform's native panel orientation is portrait. The pipa kernel exposes
# the DSI output as DSI-1 and userspace rotates it into tablet landscape.
ARMADA_PRIMARY_CONNECTOR=DSI-1
ARMADA_PANEL_ORIENTATION=right

# Suspend is deliberately conservative during bring-up. Switch to s2idle after
# the base system, input, and audio have been validated on hardware.
ARMADA_SUSPEND_MODE=fake

# Armada treats this as the display's HDR capability. Leave HDR disabled until
# pipa panel calibration is available.
ARMADA_HDR_NITS=0
