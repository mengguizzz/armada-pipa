# Qualcomm QCA6390 probes during early boot. Keep its firmware in the
# initramfs so Wi-Fi and Bluetooth do not fail before the OSTree root is
# available. The pipa kernel has CONFIG_FW_LOADER_COMPRESS_XZ enabled.
force_drivers+=" ath11k_pci btqca "
install_items+=" /usr/lib/firmware/ath11k/QCA6390/hw2.0/amss.bin.xz /usr/lib/firmware/ath11k/QCA6390/hw2.0/board-2.bin.xz /usr/lib/firmware/ath11k/QCA6390/hw2.0/m3.bin.xz /usr/lib/firmware/qca/htbtfw20.tlv.xz /usr/lib/firmware/qca/htnv20.bin.xz "
